# Woodpecker CI pipeline: test every push and pull request; deploy main.
#
# Registered at https://woodpecker.josephbernal.com (repo joe/Sunshine_Ledger).
#
# Deploy: on a push to main, once backend-tests and frontend-build pass,
# the deploy step runs scripts/deploy.sh on docker-host itself, against the
# local Docker socket. The production .env lives on the host at
# /home/joe/sunshine-ledger/deploy.env (chmod 600) -- not in the repo and not
# in Woodpecker's secret store -- and is mounted read-only. deploy.sh keeps
# its guards: public https API URL, database at the revision the code
# expects (migrations stay manual), no restart under a running pipeline job,
# post-deploy smoke test. Host mounts need the repo marked Trusted
# (volumes) in the Woodpecker repo settings.
#
# Manual deploys still work the same way: ./scripts/deploy.sh from a Mac
# checkout (see docs/RUNBOOK.md).

steps:
  - name: backend-tests
    image: python:3.12-slim
    commands:
      - cd backend
      - pip install --no-cache-dir -q -r requirements-dev.txt
      - pytest -v
    environment:
      DATABASE_URL: postgresql+psycopg://sunshine:sunshine_test_only@postgres:5432/sunshine_ledger_test
      ADMIN_USERNAME: testadmin
      ADMIN_PASSWORD: testpass
      CORS_ALLOWED_ORIGINS: http://testserver
    when:
      - event: push
      - event: pull_request

  - name: frontend-build
    image: node:20-slim
    commands:
      - cd frontend
      - npm ci
      - npm test
      - npm run build
    environment:
      # Build-time only -- no live API needed just to verify the build
      # compiles and type-checks cleanly.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    when:
      - event: push
      - event: pull_request

  - name: deploy
    image: docker:27-cli
    depends_on: [backend-tests, frontend-build]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/joe/sunshine-ledger/deploy.env:/run/secrets/deploy.env:ro
    environment:
      DEPLOY_DOCKER_CONTEXT: default
      DEPLOY_ENV_FILE: /run/secrets/deploy.env
    commands:
      - apk add --no-cache bash curl
      - ./scripts/deploy.sh
    when:
      - event: push
        branch: main

services:
  - name: postgres
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: sunshine
      POSTGRES_PASSWORD: sunshine_test_only
      POSTGRES_DB: sunshine_ledger_test
