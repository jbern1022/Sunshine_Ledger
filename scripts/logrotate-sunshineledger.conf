# Logrotate config for the scheduled-job logs on Omen (see docs/RUNBOOK.md
# "Scheduled ingestion" and "Backups"). Neither log is capped or rotated
# today -- both grow forever until someone notices.
#
# INSTALL (one-time, on Omen):
#   sudo cp scripts/logrotate-sunshineledger.conf /etc/logrotate.d/sunshineledger
#   sudo logrotate --debug /etc/logrotate.d/sunshineledger   # dry run, confirms syntax
#
# System cron already runs logrotate daily (standard on Debian/Ubuntu via
# /etc/cron.daily/logrotate), so no separate cron entry is needed once the
# file is in place.

# No copytruncate: both logs are opened fresh by `>>` on each cron
# invocation rather than held open by a long-running process, so a plain
# rotate (rename + create) is safe and doesn't risk losing lines written
# between a copy and a truncate.
/home/joe/scripts/ingestion.log
/home/joe/scripts/backup.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    create 0644 joe joe
}
